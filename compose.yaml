services:
  poker:
    build: .
    restart: unless-stopped
    volumes:
      - poker_data:/app/data
    expose:
      - "8080"
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      poker:
        condition: service_healthy
volumes:
  poker_data:
  caddy_data:
  caddy_config:
